[package]
name = "tauri-plugin-lingyi-toolbox"
version = "0.1.0"
authors = [ "lingyi" ]
description = "tauri2的一款插件，包含打开浏览器、权限检查等常用功能"
license = "MIT"
repository = "https://github.com/LY12138CLL/tauri-plugin-lingyi-toolbox"
homepage = "https://github.com/LY12138CLL/tauri-plugin-lingyi-toolbox"
documentation = "https://docs.rs/tauri-plugin-lingyi-toolbox"
edition = "2021"
links = "tauri-plugin-lingyi-toolbox"
rust-version = "1.77.2"
keywords = ["tauri","plugin","lingyi","toolbox","android","mobile"]
categories = ["api-bindings", "development-tools"]

[dependencies]
tauri = { version = "2.11.3" }
serde = "1.0"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
